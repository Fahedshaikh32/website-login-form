<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="background" aria-hidden="true">
    <span class="shape shape--blue"></span>
    <span class="shape shape--orange"></span>
  </div>

  <main class="login">
    <form class="login__form" action="#" method="post" novalidate>
      <h1 class="login__title">Login Here</h1>

      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter Username"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter Password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="login__submit">Login</button>
    </form>
  </main>

</body>
</html>
